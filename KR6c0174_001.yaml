body:
  text: 明菩薩沙彌智旭述此直指吾人現前一念介爾之心即是三般若也夫心佛衆生三無差別但以生法太廣佛法太高初心之人惟觀心為易是故大部六百餘卷既約佛法及衆生法廣明般若今但直約心法顯示般若然大部雖廣明佛法及衆生法未嘗不即心法今文雖直明心法未嘗不具佛法及衆生法故得名為三無差也以吾人現前一念介爾之心虗明洞徹了了常知不在內外中間諸處亦無過現未來形迹即是觀照般若以吾人現前一念介爾之心炳現根身器界乃至十界假實國土平等印持不前不後同時頓具即是文字般若蓋山河大地明暗色空等一切諸境界性無非文字不但紙墨語言為文字也以吾人現前一念介爾之心所有知覺之性及與境界之性無分無劑無能無所無是非是統惟一法界體即是實相般若實相般若非彼岸非此岸達此現前一念之實相故生死即涅槃名波羅蜜觀照般若亦非彼岸非此岸照此現前一念即實相故即惑成智名波羅蜜文字般若亦非彼岸非此岸顯此現前一念即實相故即結業是解脫名波羅蜜是故此心即三般若三般若祗是一心此理常然不可改變故名為經依此成行三世諸佛菩薩之所共遵故名為經説此法門天魔外道不能亂壞故名為經觀自在菩薩行深般若波羅蜜多時照見五蘊皆空度一切苦厄要知山下路須問過來人故舉觀心行成者為榜樣也觀者能觀之智即一心三觀通名觀照般若也自在者繇證實相理諦於諸境界得大解脫也菩薩翻覺有情乃自利利他之號智契實相則自利滿足智宣文字則利他普遍故名菩薩此明能行之人也深般若波羅蜜多者三智一心中得權教三乘所不能共故名為深此總明所行之法也時者追指曠劫以前而言從此一得相應則直至盡未來際終始不離深般若矣照見者別明能觀之智即觀照般若五蘊者別明所觀之境即文字般若皆空者別明所顯之諦即實相般若五陰無不即空假中四句咸離百非性絶強名為空耳度一切苦厄者自出二死苦因苦果亦令法界衆生同出二死因果即是行法之效亦即波羅蜜多也舍利子色不異空空不異色色即是空空即是色受想行識亦復如是舍利子是諸法空相不生不滅不垢不淨不增不減是故空中無色無受想行識無眼耳鼻舌身意無色聲香味觸法無眼界乃至無意識界無無明亦無無明盡乃至無老死亦無老死盡無苦集滅道無智亦無得以無所得故此廣釋五蘊皆空之境諦而觀照自在其中以非觀照不能了達此境諦故夫心者不起則已介爾有心則必頓現根身器界名為色蘊則必領納諸苦樂境名為受蘊則必取相施設名言名為想蘊則必生滅遷流不停名為行蘊則必了了分別諸法名為識蘊是知隨其所起介爾之心法爾具足五疊渾濁今以甚深般若照之了知色惟是心別無實色一切根身器界皆如空華夢物故色不異空空亦惟心別無異空設有一法過涅槃者我亦説為如幻如夢故空不異色既云不異已是相即猶恐封迷情者尚作翻手覆手之解故重示云色即是空空即是色謂隨拈一微塵色體即法界橫遍豎窮故即是空所謂全事即理無有少許理性而不在此事中即此微塵所具真空全理還即頓具法界全事故即是色所稱全理即事無有少許事相而不在此理中斯則當體絶待更無二物既於色蘊了達此實相已受想行識例皆可知又恐執迷之人謂此五蘊實相從照見生故更申示之曰是五蘊諸法當體即是真空實相本自如斯非實相生而五蘊滅以五蘊本自不生不滅故名為空相耳又恐迷者謂此五蘊空相雖非生滅而有垢淨謂凡夫隨於染緣則垢聖人隨於淨緣則淨故更申示之曰凡夫五蘊亦即空相聖人五蘊亦即空相何垢淨之有哉又恐迷者謂此五蘊空相雖無垢淨而有增減謂凡夫迷故生死浩然為增德相隱覆為減聖人悟故照用無盡為增惑業消亡為減故更申示之曰迷時亦只此諸法空相悟時亦只此諸法空相何增減之有哉既向五蘊發明此妙諦已遂即廣歷一切差別法相融絶聖凡情見而曰是故空中無色乃至亦無得也然所謂無色乃至亦無得者豈俟融絶而後無哉良以本無所得故也本無所得名之為諦了此無得名之為觀而總不離五蘊為所觀境若境若諦若觀又總不離現前一念介爾之心一心宛具三義諦即實相觀即觀照境即文字不縱橫並別亦非一異故名為深般若也菩提薩埵依般若波羅蜜多故心無罣礙無罣礙故無有恐怖遠離顛倒夢想究竟涅槃三世諸佛依般若波羅蜜多故得阿耨多羅三藐三菩提故知般若波羅蜜多是大神呪是大明呪是無上呪是無等等呪能除一切苦真實不虗此遍舉菩薩諸佛為證而明此深般若真能度一切苦厄所謂過去諸如來斯門已成就現在諸菩薩今各入圓明未來修學人當依如是法非惟觀世音也無罣礙則結業即解脫究竟方便淨涅槃無恐怖則苦果即法身究竟性淨涅槃遠離顛倒夢想則煩惑即智明究竟圓淨涅槃依實相般若得真性菩提依觀照般若得實智菩提依文字般若得方便菩提菩提是如如智智必冥理涅槃是如如理理必契智故影略而互言之此深般若即大神呪具妙用故即大明呪智照相故即無上呪實相體故即無等等呪無有一法能等此心此心能等一切諸法令其同歸實相印故此之心呪的的能除自他分段變易諸苦因果真實不虗應諦信也故説般若波羅蜜多呪即説呪曰揭諦揭諦波羅揭諦波羅僧揭諦菩提薩婆訶前之顯説既指般若即呪此之密説須知呪即般若然顯説而又密説者顯密各具四悉檀益故正以不翻為妙不宜穿鑿
